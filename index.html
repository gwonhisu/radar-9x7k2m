<!DOCTYPE html><html lang='ko'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Flow Radar 아카이브</title>
<style>
:root{--bg:#0C1424;--panel:#111C31;--line:#1E2C47;--ink:#E8EDF6;--dim:#8B98B0;
--mint:#5BD6AE;--coral:#F07A6E;--amber:#E8B44C;--chip:#1A2740}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
font-size:14px;line-height:1.55;max-width:880px;margin:0 auto;padding:32px 20px 64px}
.num{font-family:'SF Mono','Menlo','Consolas',monospace;font-variant-numeric:tabular-nums}
header{margin-bottom:8px}
.eyebrow{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:26px;font-weight:700;margin:4px 0 2px}
.basis{color:var(--dim);font-size:13px}
.basis a{color:var(--mint)}
.regime{display:flex;gap:0;margin:20px 0 28px;border:1px solid var(--line);
border-radius:10px;overflow:hidden}
.regime div{flex:1;padding:10px 12px;background:var(--panel);border-right:1px solid var(--line)}
.regime div:last-child{border-right:none}
.regime .k{font-size:11px;color:var(--dim);letter-spacing:.08em}
.regime .v{font-size:15px;font-weight:600;margin-top:2px}
.regime .changed{background:#1C2137;box-shadow:inset 0 -2px 0 var(--amber)}
section{margin-bottom:34px}
h2{font-size:13px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;
font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
h2 .cnt{color:var(--mint)} h2 .sub{font-weight:400;text-transform:none;letter-spacing:0}
.events li{list-style:none;padding:9px 12px;background:var(--panel);
border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
display:flex;gap:10px;align-items:baseline}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--dim);text-align:right;font-weight:600;
letter-spacing:.06em;padding:6px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 10px;text-align:right;border-bottom:1px solid #14203A;font-size:13.5px}
tr:hover td{background:#121E36}
.up{color:var(--mint)} .dn{color:var(--coral)} .fl{color:var(--dim)}
.bar{display:inline-block;height:8px;border-radius:2px;vertical-align:baseline}
.flag{font-size:12px}
.rrg-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.rrg-svg{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.rrg-list{flex:1;min-width:260px}
.rrg-list h3{font-size:12px;color:var(--dim);margin:10px 0 6px;font-weight:600}
.rrg-list .row{display:flex;justify-content:space-between;padding:4px 2px;
border-bottom:1px solid #14203A;font-size:13px}
.q-lead{color:var(--mint)} .q-imp{color:var(--amber)}
.q-weak{color:#B08BD9} .q-lag{color:var(--dim)}
.legend{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.7}
.xrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.xtk{min-width:110px;font-weight:600;font-size:13.5px}
.xtk em{font-style:normal;color:var(--dim);font-size:11px;margin-left:6px;font-weight:400}
.xtrack{flex:1;height:14px;background:var(--chip);border-radius:3px;position:relative;overflow:hidden}
.xzone{position:absolute;top:0;bottom:0;background:#E8B44C;opacity:0.10}
.xzone.lo{left:0;width:15%} .xzone.hi{right:0;width:15%}
.xbar{position:absolute;top:0;bottom:0;border-radius:2px}
.xmid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#3A4A6B}
.xpct{min-width:34px;text-align:right;font-size:13px;font-weight:600}
.xnet{min-width:70px;text-align:right;font-size:12.5px;color:var(--dim)}
.xoi{min-width:52px;text-align:right;font-size:12.5px;color:var(--dim)}
.xhead{color:var(--dim);font-size:10.5px;letter-spacing:.05em;padding-bottom:2px;
border-bottom:1px solid var(--line);margin-bottom:4px}
.xhead .xtrack{position:relative;height:14px;font-size:10px;color:var(--dim)}
.xcap{color:var(--dim);font-size:11.5px;margin-top:10px}
.cot-note{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.cot-block{margin-bottom:16px}
.cot-block .lbl{font-size:12px;font-weight:700;margin-bottom:6px}
.cot-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13.5px;
border-bottom:1px solid #14203A}
.cot-row .tk{min-width:64px;font-weight:600}
.cot-pct{min-width:150px;text-align:right;color:var(--dim);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px}
.chead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:13.5px}
.chead .grp{color:var(--dim);font-size:11px}
.chead .cur{margin-left:auto;font-size:13px;font-weight:700}
.cfoot{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;margin-top:2px}
.hist td{font-size:12.5px;color:var(--dim)} .hist td:first-child{color:var(--ink)}
.log{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
padding:12px 16px;color:var(--dim);font-size:13px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
color:var(--dim);font-size:11.5px;line-height:1.7}
@media(max-width:640px){.regime{flex-wrap:wrap}
.regime div{flex:1 1 45%;border-bottom:1px solid var(--line)}
.cot-pct{min-width:100px}}
</style></head><body>
<header><div class='eyebrow'>FLOW RADAR</div>
<h1>주간 리포트 아카이브</h1></header>
<section><h2>COT</h2>
<ul class='events'><li><a href='cot_flow.html' style='color:var(--mint)'>COT 흐름 (최신)</a></li></ul></section>
<section><h2>주간 리포트</h2><ul class='events'>
<li><a href='weekly_2026-09-13.html' style='color:var(--mint)'>2026-09-13</a></li>
</ul></section></body></html>
